    <style>
      /* ✅ NAVBAR VERDE DEGRADADO PREMIUM */
      .main-navbar {
        background: linear-gradient(
          90deg,
          #0a3023 0%,
          #0f4633 30%,
          #145f48 60%,
          #1b7f58 100%
        );

        font-size: 0.95rem;
        z-index: 9999 !important;
        border-bottom: 1px solid rgba(255,255,255,0.18);

      .nav-link-custom {
        color: #e9fff7 !important;
        font-weight: 500;
        margin-left: 10px;
        margin-right: 10px;
        transition: 0.25s ease;
      }

      /* Hover suave */
      .nav-link-custom:hover {
